name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/mpt.exe out/
          Copy-Item README.md out/readme.txt
          Compress-Archive -Path out/mpt.exe,out/readme.txt -DestinationPath Mpt-windows-x64.zip
          Copy-Item out/mpt.exe Mpt.exe
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($iscc) {
            $version = ((Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value)
            & $iscc.FullName assets/installer.iss /DAppVersion=$version "/DSourceDir=$(Resolve-Path out)"
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
            Move-Item "assets/Mpt-Setup-$version.exe" Mpt-Setup-$version.exe
          } else {
            Write-Host "::warning::Inno Setup not found; skipping installer"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Mpt-windows-x64
          path: |
            Mpt-windows-x64.zip
            Mpt.exe
            Mpt-Setup-*.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        # A repo whose Actions token is read-only cannot publish releases; the
        # files are still attached to the run as an artifact, so do not fail.
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Mpt-windows-x64.zip
            Mpt.exe
            Mpt-Setup-*.exe
          body: |
            This is version 1.0 — the desktop client is complete. Everything before it was the build-up.

            Added:
            - Subjects can be created right in the app: subject menu (›), "+ add subject" at the bottom, type a name, Enter. It is created on YPT exactly like on your phone — same servers, same colour palette — so it shows up everywhere, and it works while a session is running.

            Fixed Bug:
            - "+ add subject" ignored clicks while a session was running and said nothing. Creating now works at any time; only selecting a different subject waits for the timer to stop.
