name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/mpt.exe out/
          Copy-Item README.md out/readme.txt
          Compress-Archive -Path out/mpt.exe,out/readme.txt -DestinationPath Mpt-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Mpt-windows-x64
          path: Mpt-windows-x64.zip
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        # A repo whose Actions token is read-only cannot publish releases; the
        # zip is still attached to the run as an artifact, so do not fail there.
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: Mpt-windows-x64.zip
          body: |
            Fixed Bug:
            - No icon in alt-tab or on the taskbar: the window icon was fed the logo PNG's raw 3-bytes-per-pixel RGB data labelled as RGBA, so the system icon came out garbled and blank. The mark is now decoded to real RGBA once and shared by the title bar and the window icon.
