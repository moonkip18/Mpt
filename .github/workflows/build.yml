name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/mpt.exe out/
          Copy-Item README.md out/readme.txt
          Compress-Archive -Path out/mpt.exe,out/readme.txt -DestinationPath Mpt-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Mpt-windows-x64
          path: Mpt-windows-x64.zip
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        # A repo whose Actions token is read-only cannot publish releases; the
        # zip is still attached to the run as an artifact, so do not fail there.
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: Mpt-windows-x64.zip
          body: |
            Fixed Bug:
            - Start button was a blank white slab: the label colour was baked into the text layout and egui only recolours placeholder runs, so "Start" painted light-on-light. The label now overrides to the near-black ink and shows again (Segoe UI Semibold, like the original).
            - Start button flashed black when clicked: pressing disabled it for a beat (dark surface with visible text); the original only brightens on hover, so the press darkening is gone.
            - Text did not match the original client: section headers ("STUDY LOG", "TODAY", "TODAY BY SUBJECT", state label) now use the Segoe UI caps style with 1.6 letter spacing, the clock's subject line is Georgia italic, the wordmark and brand use the tracked semibold style, action buttons are semibold, and input text is 14 px plain ink with faint hints and a 1 px ink caret.
            - Clock was oversized and labels sat low: clock 92 -> 86 px and the caps labels are baseline-lifted to the original's optical line.
            - Small labels were too loud: "connected to YPT" is faint ink, mini-player subject sits on the original's baseline, selected row in the all-subjects menu is semibold.
            - No "app is loaded" cue: a one-shot 300 ms opacity settle plays the first time real timer data arrives — no glow, no blur, no shadow, no new dependencies.
            - Hover and bar animations keep one duration (0.12 s hover, 0.45 s bars) — the only smoothness change retained from the earlier feel layer.
