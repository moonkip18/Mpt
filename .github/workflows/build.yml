name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/mpt.exe out/
          Copy-Item README.md out/readme.txt
          Compress-Archive -Path out/mpt.exe,out/readme.txt -DestinationPath Mpt-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Mpt-windows-x64
          path: Mpt-windows-x64.zip
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        # A repo whose Actions token is read-only cannot publish releases; the
        # zip is still attached to the run as an artifact, so do not fail there.
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: Mpt-windows-x64.zip
          body: |
            Fixed Bug:
            - TODAY header sat at the wrong spot (it slipped off the window edge when the header gained letter spacing): it is right-aligned to the column edge again, above the day total.
            - The first seconds after sign-in looked broken: the home screen drew empty while subjects and today's numbers were still loading from the API. The window now holds the title bar with a quiet spinner until the data lands, and the 300 ms settle fade covers the switch — no glow, no blur, no new dependencies.
