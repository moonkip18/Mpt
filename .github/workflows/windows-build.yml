name: Windows build

# Builds Mpt on a GitHub-hosted Windows runner, which already has the MSVC
# toolchain this machine lacks. The zip lands as a release asset (downloadable
# without logging in) and as a run artifact.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          $out = "build\windows\x64\runner\Release"
          if (-not (Test-Path "$out\mpt.exe")) { throw "mpt.exe was not produced" }
          Compress-Archive -Path "$out\*" -DestinationPath Mpt-windows-x64.zip -Force
          Get-Item Mpt-windows-x64.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Mpt-windows-x64
          path: Mpt-windows-x64.zip
          if-no-files-found: error

      - name: Publish release asset
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Mpt v0.1.0
          body: Automated Windows build of Mpt.
          files: Mpt-windows-x64.zip
