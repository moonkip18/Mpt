[package]
name = "mpt"
version = "1.0.1"
edition = "2024"
description = "A minimal desktop study timer for Yeolpumta"
repository = "https://github.com/moonkip18/Mpt"

[[bin]]
name = "mpt"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow"] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
rand = "0.8"
png = "0.17"

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
